{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-dark">
      <h2 class="text-center mb-3">💰 Expense Tracker</h2>
      <form method="POST" action="/add" class="row g-3">
        <div class="col-12">
          <input type="text" name="name" class="form-control" placeholder="Expense Name" required>
        </div>
        <div class="col-12">
          <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
        </div>
        <div class="col-12">
          <input type="date" name="date" class="form-control" required>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-custom">➕ Add Expense</button>
          <button type="button" class="btn btn-success" onclick="generateReport()">📊 Generate Report</button>
        </div>
      </form>
    </div>
    <div class="card mt-4 p-3 bg-light">
      <h4 class="text-dark">Expenses</h4>
      <ul class="list-group">
        {% for expense in expenses %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ expense.name }} - Rs. {{ expense.amount }} <small>({{ expense.date }})</small></span>
            <a href="/delete/{{ expense.id }}" class="btn btn-sm btn-danger">🗑 Delete</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal fade" id="reportModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content text-dark">
      <div class="modal-header">
        <h5 class="modal-title">Monthly Expense Report</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <canvas id="reportChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
async function generateReport() {
  const response = await fetch("/report");
  const data = await response.json();

  const ctx = document.getElementById('reportChart').getContext('2d');
  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: data.labels,
      datasets: [{
        data: data.data,
        backgroundColor: [
          '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
          '#9966FF', '#FF9F40', '#C9CBCF'
        ]
      }]
    }
  });

  new bootstrap.Modal(document.getElementById('reportModal')).show();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
