{% extends "base.html" %}

{% block content %}
  <h1 class="mb-3">Todo List</h1>

  <form method="POST" class="row g-3 mb-3">
    <div class="col-auto">
      <input type="text" name="task" class="form-control" placeholder="Add new task" required>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-success">Add Task</button>
    </div>
  </form>

  {% if tasks %}
    <ul class="list-group">
      {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          {{ task }}
          <a href="{{ url_for('delete_task', task_id=loop.index0) }}" class="btn btn-sm btn-danger">Delete</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-muted">No tasks available.</p>
  {% endif %}

  <hr>
  <p>🌦️ Want to see the forecast? 
     <a href="{{ url_for('weather') }}" class="btn btn-primary">Check Weather</a>
  </p>
{% endblock %}
